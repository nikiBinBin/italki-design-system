  <body>
    <div class="app-shell">
      <aside class="sidebar-navigation" aria-label="Component categories">
        <div class="sidebar-brand"><a class="brand-home" href="#components" aria-label="Back to Overview"><img class="logo" src="Assets/Icons/logo-italki-wordmark.svg" alt="italki" /></a></div>
        <div class="sidebar-menu"><div class="sidebar-search" id="sidebar-search"></div><div class="sidebar-menu-scroll"><a href="#components" id="overview-link">Overview</a><a class="sidebar-fixed-link" href="#design-principles" id="principles-link" data-route="design-principles">Principles</a><div id="category-nav"></div></div></div>
      </aside>

        <div class="content">

            </div>

    </div>
    <script src="catalog-runtime/icon-manifest.js"></script>
    <script src="catalog-runtime/contracts.js"></script>
    <script src="catalog-runtime/italki-ui.js?v=20260811-breadcrumb-separator-size"></script>
    <script>
      const ui = window.ITalkiUI;
      if (!ui) throw new Error("italki UI kit did not load");
      const parse = (rows) => rows.split(";").map((row) => {
        const [name, description] = row.split("|");
        return { name, description };
      });
      const groups = [
        { id: "principles", title: "Principles", description: "", data: parse("Design Principles|Product direction and decision principles.") },
        { id: "foundation", title: "Foundation", description: "", data: parse("Color|Color tokens and semantic roles.;Typography|;Icon library|Browse the italki icon assets by size and source set.;Spacing|Module padding and margin scale.;Grid|Responsive page and composition grid.;Image|Approved image ratios for content and banners.;Radius|Corner radius scale and component mapping.;Shadow|Surface-depth tokens and elevation boundaries.") },
        { id: "general", title: "General", description: "", data: parse("Button variants|Button hierarchy and visual variants.;Link|;Chip|Compact reversible local choice.;Segmented control|Compact switch between closely related views.") },
        { id: "data-entry", title: "Data Entry", description: "", data: parse("Form field|Label, support, validation, and one supplied control.;Text input|Controlled single-line text entry.;Textarea|Controlled multi-line text entry.;Number stepper|Controlled bounded numeric quantity.;Upload|Controlled file selection and supplied upload status.;Search|Controlled query input with supplied search behavior.;Select|Controlled value selection, including searchable Combobox.;Checkbox|Controlled multi-select choice, mixed state, and related checkbox groups.;Radio|Controlled single-select choice with supplied group behavior.;Date picker|Controlled date or date-range selection.;Time picker|Controlled single time selection.;Time slot|Bookable or unavailable supplied time.;Rate|Controlled fractional rating input.;Selection|Controlled selectable item, button, or row.;Slider|Controlled bounded numeric range.;Switch|Controlled immediate binary action.") },
        { id: "data-display", title: "Data Display", description: "", data: parse("Card|Bounded discrete object or actionable content surface.;List|Ordered local records with supplied identity, supporting text, and trailing content.;Video|Teaching-introduction media: a cover and the way in.;Avatar|Person image, initials, country marker, and supplied group composition.;Badge|Compact count, dot, or status marker.;Tag|Compact static attribute or removable selected value.;Tabs|Controlled local content-view switcher.;Statistic|Emphasized supplied numeric fact.;Table|Structured collection display.;Calendar|Weekly availability display composed from supplied Time slot and Time picker primitives.;Timeline|Chronological supplied events.;Disclosure|Optional local details revealed by the user.") },
        { id: "layout", title: "Layout", description: "", data: parse("Section intro|Reusable section title, optional context, and one supplied local action.;Divider|Structural content separator.;Panel|Bounded content region with optional title.;Stepper|Ordered task stages and current position, including compact flow progress.") },
        { id: "overlays", title: "Overlays", description: "", data: parse("Tooltip|Passive contextual hint for a supplied trigger.;Modal|Controlled blocking task dialog.;Drawer|Controlled edge-anchored task surface.;Popconfirm|Controlled lightweight action confirmation.;Popup|Controlled anchored supporting surface.;Popover|Controlled anchored supporting information.;Dropdown menu|Controlled menu of local commands.") },
        { id: "feedback", title: "Feedback", description: "", data: parse("Alert|Persistent local status message and recovery action.;Toast|Temporary global acknowledgement.;Notification|Persistent product-level update with optional action and dismissal.;Result|Full-task confirmed outcome with explicit next action.;Progress|Bounded task completion feedback.;Skeleton|Layout-preserving loading placeholder.") }
      ];
      const navigationComponents = parse("Top nav|Persistent top-level context, search, and action slots.;Breadcrumb|Current location within a supplied navigation hierarchy.;Sidebar|Persistent authenticated workspace navigation.;Footer|Supplied page-end navigation and utility region.;Pagination|Collection-local page navigation.");
        const patternComponents = parse("Workspace shell|Authenticated navigation composition with product-owned destinations and account context.;Teacher discovery|Search, refinement, and teacher-evaluation composition.;Filter|;Teacher card|;Lesson card|Supplied lesson, teacher, timing, package, and status composition.;Teacher detail|Evidence-led teacher profile composition before booking.;Booking commitment|Lesson, time, price, and booking-action composition.;Payment checkout|Payment-route and final-amount composition.;Mira module|Intentional personalized continuation or campaign composition.");
      const sidebarNavigationCategories = [
        { id: "foundation", title: "Foundation", groups: [{ id: "foundation-items", title: "", data: groups[1].data }] },
        {
          id: "components",
          title: "Components",
          groups: [
            ...groups.slice(2),
            { id: "navigation", title: "Navigation", description: "", data: navigationComponents }
          ]
        },
        { id: "patterns", title: "Patterns", groups: [{ id: "pattern-items", title: "", data: patternComponents }] }
      ];
      // The Icon Library lists catalog-runtime/icon-manifest.js, generated from
      // the icon assets by maintenance/scripts/build-icon-manifest.mjs (pinned brand
      // marks first, three duplicate glyphs excluded — reasons live in the
      // script). validate-contracts.mjs fails when the manifest is stale, so a
      // new icon cannot silently miss this page.
      const iconAssets = window.ITalkiIconManifest.slice();
      // Bundled from the approved Flags library: 252 unique ISO 3166-1 alpha-2 countries and territories.
      const flagCodes = `ae ar at au bd be br ca ch cl cn co cz de dk eg es fi fr gb gr hk hu id ie il in ir is it jp ke kr ma mx my ng nl no nz pe ph pk pl pt ro ru sa se sg th tr tw ua us vn za`.split(/\s+/);
      const flagLabelOverrides = { gb: "UK", us: "USA", kr: "Korea", kp: "North Korea", cz: "Czechia" };
      const flagAssetPath = (countryCode) => `Assets/Flags/${countryCode.toLowerCase()}.svg`;
      const flagLabel = (countryCode) => {
        const code = countryCode.toLowerCase();
        if (flagLabelOverrides[code]) return flagLabelOverrides[code];
        try { return new Intl.DisplayNames(["en"], { type: "region" }).of(code.toUpperCase()) || code.toUpperCase(); }
        catch { return code.toUpperCase(); }
      };
      let route = "components";
      const routeScrollPositions = new Map();
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      let routeScrollCapturePending = false;
      let iconGroup = "24px";
      let iconQuery = "";
      let flagQuery = "";
      let sidebarSearchQuery = "";
      const sidebarCategoryOpen = { foundation: true, components: true, patterns: true };
      const gallery = document.getElementById("gallery");
      const byName = (entry) => entry.name.toLowerCase();
      const slug = (value) => value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
      const allEntries = () => [...groups, { id: "navigation", title: "Navigation", description: "", data: navigationComponents }, { id: "patterns", title: "Patterns", description: "", data: patternComponents }].flatMap((group) => group.data.map((entry) => ({ ...entry, group })));
      const entryFromRoute = () => allEntries().find((entry) => slug(entry.name) === (route === "combobox" ? "select" : route));
      const catalogScrollRoot = () => document.querySelector("main");
      const usesDesktopCatalogScroll = () => window.matchMedia("(min-width: 861px)").matches;
      const getCatalogScrollTop = () => {
        const root = catalogScrollRoot();
        return usesDesktopCatalogScroll() && root ? root.scrollTop : window.scrollY;
      };
      const setCatalogScrollTop = (top) => {
        const root = catalogScrollRoot();
        if (usesDesktopCatalogScroll() && root) {
          root.scrollTo({ top, left: 0, behavior: "auto" });
          return;
        }
        window.scrollTo({ top, left: 0, behavior: "auto" });
      };
      const captureRouteScroll = () => {
        if (routeScrollCapturePending) return;
        routeScrollPositions.set(route, getCatalogScrollTop());
        routeScrollCapturePending = true;
      };

      function identity() {
        return `<div class="identity">${ui.avatar({ name: "Maria G.", initials: "M", size: 48 })}<div><b>Maria G.</b><span>English tutor</span></div></div>`;
      }
      function avatarGroupPreview() {
        const members = [
          { name: "Maya Chen", image: "Assets/Images/avatars/teacher-bob.png" },
          { name: "Elena Ruiz", image: "Assets/Images/avatars/teacher-rachel.png" },
          { name: "James Park", image: "Assets/Images/avatars/teacher-james.png" },
          { name: "Lucia Garcia", image: "Assets/Images/avatars/teacher-lucia.png" }
        ];
        return ui.avatarGroup({ members, overflow: 5, size: "md", ariaLabel: "Recommended teachers" });
      }
      function infoCluster() {
        return '<div class="info-cluster"><div><span>Lessons</span><strong>12</strong></div><div><span>Response time</span><strong>1 hour</strong></div><div><span>Rating</span><strong>4.9</strong></div></div>';
      }
      function iconGroupFor(asset) {
        if (asset.includes("/16px/")) return "16px";
        return "24px";
      }
      function iconLabel(asset) {
        return asset.split("/").pop().replace(/\.svg$/i, "");
      }
      function iconCategoryFor(asset) {
        const name = iconLabel(asset).toLowerCase();
        if (name.includes("logo")) return "brand";
        if (/(arrow|chevron|back|forward|hamburger|menu|compass|location|earth|pin|layout)/.test(name)) return "navigation";
        if (/(message|chat|comment|mail|send|call|phone|microphone|speaker|volume|voice|announcement|bell|video|webcam)/.test(name)) return "communication";
        if (/(lesson|teacher|student|learn|vocabulary|topic|translate|whiteboard|book|test|classroom|grammar|pronounce|smart-lesson|recall)/.test(name)) return "learning";
        if (/(wallet|credit|card|coupon|finance|coin|bank|money|payment|shopping|briefcase|account|user|users|profile)/.test(name)) return "account";
        if (/(image|file|document|attachment|camera|photo|art|movie|music|comics|gallery|media|food|fashion|gaming|history|nature|science|sport|travel|writing)/.test(name)) return "content";
        if (/(alert|error|warning|info|check|confirm|success|heart|star|favorite|eye|lock|privacy|shield|help|question|notification|online)/.test(name)) return "status";
        if (/(add|plus|minus|delete|edit|copy|download|upload|share|filter|search|sort|refresh|setting|save|replace|scan|close|cross|more|switch|play|stop|calendar)/.test(name)) return "actions";
        return "other";
      }
      const iconCategoryLabels = {
        brand: "Brand",
        navigation: "Navigation",
        actions: "Actions",
        communication: "Communication",
        learning: "Learning",
        content: "Content & media",
        account: "Account & payments",
        status: "Status & feedback",
        other: "Other"
      };
      const iconCategoryOrder = Object.keys(iconCategoryLabels);
      function renderIconGrid() {
        const grid = document.getElementById("icon-grid");
        if (!grid) return;
        const query = iconQuery.toLowerCase();
        const visible = iconAssets.filter((asset) => (iconGroup === "all" || iconGroupFor(asset) === iconGroup) && (!query || asset.toLowerCase().includes(query)));
        const tile = (asset) => {
          const assetGroup = iconGroupFor(asset);
          const assetSize = assetGroup === "16px" ? 16 : 24;
          const isPlusLogo = iconLabel(asset) === "logo-italki-plus";
          const isPlusFeaturesLabel = iconLabel(asset) === "plus-features-label";
          const isInverseBrandLogo = /logo-italki-(?:logomark|wordmark)-white/.test(iconLabel(asset));
          const visual = isPlusLogo ? '<span class="icon-italki-plus" aria-hidden="true"><img src="Assets/Icons/logo-italki-wordmark.svg" alt="" /><img class="icon-plus-logo" src="Assets/Icons/logo-italki-plus.svg" alt="" /></span>' : (isPlusFeaturesLabel ? `<img class="icon-plus-features-label" src="${asset}" alt="" />` : `<img src="${asset}" alt="" width="${assetSize}" height="${assetSize}" style="width:${assetSize}px;height:${assetSize}px" />`);
          return `<div class="icon-tile size-${assetGroup}${isInverseBrandLogo ? " brand-inverse" : ""}"><button class="icon-copy" type="button" data-copy-icon="${asset}" aria-label="Copy ${iconLabel(asset)} asset path" title="Copy asset path"><img src="Assets/Icons/copy.svg" alt="" /></button>${visual}<span title="${iconLabel(asset)}">${iconLabel(asset)}</span></div>`;
        };
        grid.innerHTML = iconCategoryOrder.map((category) => {
          const assets = visible.filter((asset) => iconCategoryFor(asset) === category).sort((a, b) => {
            if (category !== "brand") return 0;
            const aInverse = /logo-italki-(?:logomark|wordmark)-white/.test(iconLabel(a));
            const bInverse = /logo-italki-(?:logomark|wordmark)-white/.test(iconLabel(b));
            return Number(aInverse) - Number(bInverse);
          });
          if (!assets.length) return "";
          return `<section class="icon-category"><div class="icon-grid"><h2 class="icon-category-title">${iconCategoryLabels[category]}</h2>${assets.map(tile).join("")}</div></section>`;
        }).join("") || '<p class="icon-empty">No icon assets match these filters.</p>';
      }
      async function copyIconAsset(asset, tile) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(asset);
          else {
            const source = document.createElement("textarea");
            source.value = asset;
            source.setAttribute("readonly", "");
            source.style.position = "fixed";
            source.style.opacity = "0";
            document.body.append(source);
            source.select();
            document.execCommand("copy");
            source.remove();
          }
          tile.classList.add("copied");
          window.setTimeout(() => tile.classList.remove("copied"), 1200);
        } catch (_) {
          tile.classList.remove("copied");
        }
      }
      function iconLibraryDetail() {
        const groups = ui.segmentedControl({ id: "icon-library-group", options: [{ value: "24px", label: "24px" }, { value: "16px", label: "16px" }, { value: "all", label: "All" }], selected: "24px", size: 32, shape: "pill", ariaLabel: "Icon asset group" });
        return `<section class="detail-section"><div class="detail-sample"><div class="icon-toolbar"><div class="icon-filter-sets"><div class="icon-filter-set">${groups}</div></div>${ui.search({ id: "icon-search", placeholder: "Search icon assets", size: 40, shape: "pill" })}</div><div class="icon-groups" id="icon-grid"></div></div></section>`;
      }
      function principlesDetail() {
        const list = (items) => `<ul>${items.map((item) => `<li>${item}</li>`).join("")}</ul>`;
        const guidance = (designFor, avoid, questions) => `<div class="principle-guidance"><section><h3>Design for</h3>${list(designFor)}</section><section><h3>Avoid</h3>${list(avoid)}</section><section><h3>Ask in critique</h3>${list(questions)}</section></div>`;
        const principle = ({ title, paragraphs, designFor, avoid, questions }) => `<section class="principle-row"><h2>${title}</h2>${paragraphs.map((paragraph) => `<p>${paragraph}</p>`).join("")}${guidance(designFor, avoid, questions)}</section>`;
        const principles = [
          {
            title: "Human Connection Comes First",
            paragraphs: ["Language is learned through people, culture, and shared experience. italki should make it easier for learners and teachers to find, trust, meet, speak with, and continue with each other.", "Design should foreground the human relationship: the teacher, the learner, the conversation, the lesson, the feedback, the progress, and the cultural context. Technology can support the connection, but it should not become the center of attention."],
            designFor: ["clear paths to find, compare, contact, book, and rebook teachers", "teacher profiles that reveal real teaching style, expertise, personality, availability, lesson types, and fit", "classroom experiences where video, voice, names, permissions, network state, and lesson context are immediately understandable", "social proof, reviews, credentials, and community signals that help people choose with confidence", "communication patterns that feel respectful, warm, and personal"],
            avoid: ["AI or gamified features that compete with teachers for attention", "hiding messages, lessons, teacher profiles, packages, or favorite teachers behind unnecessary navigation", "abstract learning mechanics that make the experience feel less human or less real", "marketplace changes that reduce teacher visibility without a clear user benefit"],
            questions: ["Does this help a learner connect with the right human teacher faster?", "Does this help a teacher be understood, trusted, and booked by the right learners?", "Is the human relationship more visible than the system around it?"]
          },
          {
            title: "Make Learning Feel Real",
            paragraphs: ["italki is not just a study tool. It is a way to speak, belong, travel, work, study, teach, and participate in the world. Design should connect language practice to real expression, real contexts, and real progress.", "Every interaction should respect that language learning is emotional: people feel nervous, proud, embarrassed, curious, stuck, motivated, and transformed. The product should make practice feel safe and useful, not performative or punitive."],
            designFor: ["conversation, expression, and cultural nuance over isolated completion loops", "practice activities that encourage trying, retries, exploration, and learning from mistakes", "visible progress that feels meaningful rather than childish or stressful", "lesson preparation, notes, vocabulary, summaries, and homework that help the next real conversation", "learning paths that adapt to goals such as travel, belonging, career, exams, confidence, or personal growth"],
            avoid: ["correctness-first flows that punish experimentation", "artificial streaks, pets, rewards, or pressure that distract from real learning", "empty celebration that does not connect to skill, confidence, or use in life", "over-scripted experiences that make communication feel fake"],
            questions: ["Does this help someone speak, understand, or participate in real life?", "Does it make mistakes safer and progress clearer?", "Would a serious adult learner feel respected by this experience?"]
          },
          {
            title: "Earn Trust Through Clarity And Transparency",
            paragraphs: ["Trust is the core currency of a language-learning marketplace. Learners trust italki with their time, money, goals, confidence, and sometimes anxiety. Teachers trust italki with their income, reputation, schedule, and professional identity.", "Design must be clear about what is happening, why it is happening, what the user can control, and what the consequences are. This is especially important for payments, packages, booking, cancellation, teacher discovery, AI, recording, ranking, permissions, privacy, and data."],
            designFor: ["clear labels, legible hierarchy, precise controls, and predictable navigation", "transparent marketplace signals: price, availability, teacher type, credentials, lesson length, cancellation policy, response expectations, and profile metrics", "plain-language explanations for AI, recording, permissions, personalization, and recommendations", "confirmation states, undo paths, recovery flows, and audit trails where trust is at stake", "localization quality that preserves meaning, tone, placeholders, and cultural nuance across languages"],
            avoid: ["hidden consequences, vague system behavior, or unexplained ranking and recommendation changes", "decorative hierarchy that makes basic actions harder to find", "AI suggestions that appear authoritative without confidence, source, or user control", "metrics that can be triggered accidentally or interpreted incorrectly"],
            questions: ["Can users tell what will happen before they act?", "Can they understand why the system is recommending, ranking, recording, charging, or asking for permission?", "Would this still feel fair from both the learner and teacher side?"]
          },
          {
            title: "Keep The Core Path Simple",
            paragraphs: ["Learning a language is already hard. italki should not add avoidable cognitive load. The most important user paths - find a teacher, book a lesson, attend a lesson, message, manage packages, continue learning, and teach successfully - should be obvious, stable, and efficient.", "Simplicity does not mean fewer ideas. It means the interface protects attention and makes the next useful action easy to recognize."],
            designFor: ["persistent, recognizable access to lessons, messages, search, favorite teachers, packages, calendar, and profile", "fewer clicks for repeated high-frequency actions", "content-first layouts where controls support the task instead of competing with it", "sensible defaults with progressive disclosure for advanced settings", "continuity across web and app so users do not relearn the product in every context"],
            avoid: ["making frequent actions depend on memory, hidden gestures, narrow sidebars, or buried menus", "putting novelty ahead of core tasks", "forcing users through promotional, AI, or gamified surfaces when they came to book, teach, or attend", "redesigning familiar flows without beta testing and migration support"],
            questions: ["What is the user's primary job here, and is it visually obvious?", "Can an existing learner or teacher complete their usual task without relearning the platform?", "What can we remove, defer, or make optional?"]
          },
          {
            title: "Give People Agency",
            paragraphs: ["italki works because people have different goals, schedules, budgets, learning styles, teaching styles, cultures, devices, and comfort levels. Design should offer meaningful choice without making users assemble the whole experience from scratch.", "Agency means people can choose, adapt, pause, retry, compare, hide, change, and recover. It also means teachers have enough control to represent their work accurately and sustainably."],
            designFor: ["flexible scheduling, lesson length, price, language, teacher type, specialization, and platform choices", "search and filters that match how learners actually decide", "teacher tools that support profile quality, lesson visibility, analytics, availability, and income stability", "user control over AI assistance, gamification, notifications, recording, layout, and learning modes", "optional branches for different goals while keeping recommended paths clear"],
            avoid: ["locking users into one rigid learning or booking model", "assuming one design works equally for first-time learners, long-time students, teachers, mobile users, and older users", "making optional features feel mandatory", "removing controls that users rely on without a better replacement"],
            questions: ["What choices matter here, and are they available at the right moment?", "Can users opt out of non-essential assistance or personalization?", "Does this increase or reduce teacher agency?"]
          },
          {
            title: "Design Technology As A Helpful Companion",
            paragraphs: ["italki should feel like friendly technology with a human touch: modern, capable, and personal, but never technology for technology's sake. AI and automation should reduce effort, increase confidence, and create more opportunities for teachers and learners.", "The right role for AI is to prepare, explain, summarize, translate, recommend, organize, and coach - while making the human lesson, teacher, and learner more successful."],
            designFor: ["AI that empowers teachers and learners rather than replacing them", "clear AI boundaries: what it can do, what it cannot do, what data it uses, and how users can correct it", "assistive moments around preparation, vocabulary, lesson summaries, grammar, translation, discovery, and support", "human review for brand-sensitive content, localization quality, marketplace-sensitive ranking, and high-stakes decisions", "calm, respectful AI entry points that appear when useful and recede when not"],
            avoid: ["AI pretending to be human", "AI front and center when the user's goal is to reach a teacher, lesson, message, or booking flow", "automation that makes teachers less visible or less understood", "novelty that adds friction, anxiety, or mistrust"],
            questions: ["Who is being empowered by this technology?", "Is the AI reducing effort or adding another thing to manage?", "Could this harm trust, teacher income, learning quality, or user control?"]
          },
          {
            title: "Craft For A Global, Inclusive Community",
            paragraphs: ["italki is global by nature: many languages, cultures, devices, markets, ages, learning goals, and accessibility needs. The experience should feel open, welcoming, localized, and resilient across contexts.", "Craft is not only visual polish. It is consistency, accessibility, performance, localization, motion, state design, empty states, error handling, documentation, and the small details that make the product feel reliable."],
            designFor: ["accessible color, type, focus states, keyboard support, screen-reader clarity, and touch targets", "localization-ready layouts and copy across supported languages, including text expansion and future RTL needs", "consistent design-system components, patterns, tokens, and interaction states", "platform familiarity on iOS, Android, and web while preserving italki's own brand character", "fast loading, graceful failure, clear empty states, and recovery from poor network or permission issues", "moments of delight that are warm, respectful, and connected to learning or belonging"],
            avoid: ["visual polish that hides information or reduces usability", "one-market assumptions about language, humor, culture, age, or technical confidence", "inconsistent components or custom patterns where familiar ones would be clearer", "motion, decoration, or personality that distracts from learning and teaching"],
            questions: ["Does this work for different languages, ages, devices, and levels of technical confidence?", "Is the interface familiar enough to trust and distinctive enough to be italki?", "Are accessibility, localization, loading, errors, and edge cases designed - not left over?"]
          }
        ];
        const standards = [
          ["Navigation And Hierarchy", ["Prioritize content and primary actions over decoration.", "Keep frequent actions stable and visible.", "Use hierarchy, spacing, and motion to clarify meaning, not to impress.", "Avoid hiding core tasks behind icons, drawers, or assistant surfaces without strong evidence."]],
          ["Marketplace And Teacher Discovery", ["Help learners compare teachers by fit, not only by price or algorithmic score.", "Make profile depth easy to access: teaching style, lesson types, availability, intro video, qualifications, specialties, policies, and reviews.", "Treat teacher visibility and analytics as trust-sensitive product surfaces.", "Test ranking, discovery, and profile changes with both learner conversion and teacher health metrics."]],
          ["AI And Personalization", ["AI should be optional or contextual unless it is essential to the user's task.", "Explain when AI is used and what user data or lesson data informs it.", "Preserve human review for sensitive content and marketplace-impacting decisions.", "Measure whether AI improves booking, learning, teaching, support, and retention - not just engagement with AI itself."]],
          ["Learning And Practice", ["Encourage trying over perfection.", "Use feedback that is specific, kind, and actionable.", "Connect practice to real conversation and learner goals.", "Let learners repeat, skip, branch, or go deeper without penalty."]],
          ["Rollout And Feedback", ["Beta test major navigation, AI, classroom, marketplace, and profile changes with students and teachers before broad rollout.", "Monitor support tickets, CSAT, NPS, app reviews, forum sentiment, teacher bookings, profile views, and lesson completion.", "Communicate major changes clearly and early.", "Treat confusion in core tasks as a release blocker, not a training problem."]]
        ];

      function bindTeacherDiscoveryPattern(root) {
        const pattern = root.querySelector(".teacher-discovery-pattern");
        if (!pattern) return;
        const name = pattern.querySelector("[data-teacher-discovery-preview-name]");
        const price = pattern.querySelector("[data-teacher-discovery-preview-price]");
        const avatar = pattern.querySelector(".teacher-discovery-preview__identity .ui-avatar__image");
        const video = pattern.querySelector("[data-teacher-discovery-preview-video]");
        const cards = [...pattern.querySelectorAll("[data-teacher-discovery-result]")];
        const resultCount = pattern.querySelector("[data-teacher-discovery-result-count]");
        const status = pattern.querySelector("[data-teacher-discovery-status]");
        const search = pattern.querySelector("#teacher-discovery-search");
        const filterModal = pattern.querySelector("#teacher-discovery-filter-modal");
        const setStatus = (message) => { if (status) status.textContent = message; };
        const previewCard = (card, announce = true) => {
          if (!card || card.hidden) return;
          cards.forEach((item) => item.classList.toggle("is-previewed", item === card));
          if (name) name.textContent = card.dataset.previewName;
          if (price) price.textContent = card.dataset.previewPrice;
          if (avatar) { avatar.src = card.dataset.previewImage; avatar.alt = ""; }
          if (video) video.innerHTML = ui.video({ id: "teacher-discovery-preview-video", poster: "Assets/Images/covers/teacher-intro.jpg", posterAlt: "Teacher introduction", title: "Meet your teacher", duration: card.dataset.previewDuration, playLabel: `Play ${card.dataset.previewName} introduction` });
          if (announce) setStatus(`${card.dataset.previewName} is selected for preview.`);
        };
        const refreshResults = () => {
          const query = (search?.value || "").trim().toLowerCase();
          const selectedFilters = new Set([...pattern.querySelectorAll("[data-teacher-discovery-filter].is-selected")].map((control) => control.dataset.teacherDiscoveryFilter));
          const visible = cards.filter((card) => {
            const matchesSearch = !query || card.dataset.search.includes(query);
            const matchesAvailability = !selectedFilters.has("available") || /now|today/i.test(card.dataset.availability);
            const matchesRole = !selectedFilters.has("professional") || card.dataset.role === "Professional Teacher";
            const matches = matchesSearch && matchesAvailability && matchesRole;
            card.hidden = !matches;
            return matches;
          });
          if (resultCount) resultCount.textContent = `${visible.length} ${visible.length === 1 ? "teacher" : "teachers"}`;
          const current = cards.find((card) => card.classList.contains("is-previewed"));
          if (visible.length && (!current || current.hidden)) previewCard(visible[0], false);
          if (!visible.length) setStatus("No teachers match these refinements.");
          return visible.length;
        };
        cards.forEach((card) => {
          card.addEventListener("mouseenter", () => previewCard(card, false));
          card.addEventListener("focus", () => previewCard(card));
        });
        search?.addEventListener("input", () => {
          const count = refreshResults();
          setStatus(`${count} ${count === 1 ? "teacher matches" : "teachers match"} your search.`);
        });
        pattern.addEventListener("click", (event) => {
          const removeTag = event.target.closest('[data-demo="teacher-discovery-tag-remove"]');
          if (removeTag) { removeTag.closest("[data-component=tag]")?.remove(); setStatus("Filter tag removed."); return; }
          const switchControl = event.target.closest('[data-demo="teacher-discovery-a1"]');
          if (switchControl) {
            const enabled = ui.toggleSwitch(switchControl);
            pattern.classList.toggle("is-a1", enabled);
            setStatus(enabled ? "Beginner-teaching details are shown." : "Beginner-teaching details are hidden.");
            return;
          }
          const save = event.target.closest("[data-teacher-discovery-save]");
          if (save) {
            const button = save.querySelector("button");
            const saved = button.classList.toggle("is-saved");
            button.setAttribute("aria-pressed", String(saved));
            button.setAttribute("aria-label", `${saved ? "Remove" : "Save"} ${save.closest("[data-teacher-discovery-result]").dataset.previewName}`);
            setStatus(`${save.closest("[data-teacher-discovery-result]").dataset.previewName} ${saved ? "saved" : "removed from saved teachers"}.`);
            return;
          }

          const value = Math.max(1, Number(output.value || output.textContent) + (type === "plus" ? 1 : -1));
          output.value = value;
          output.textContent = value;
        } else if (type === "popover") control.parentElement.classList.toggle("open");
        else if (type === "accordion") control.parentElement.classList.toggle("open");
        else if (type === "ui-top-nav-context") ui.setTopNavContextOpen(control);
        else if (type === "ui-top-nav-context-option") ui.selectTopNavContext(control);
        else if (type === "ui-top-nav-search-clear") ui.clearTopNavSearch(control);
        else if (type === "ui-search-clear") {
          ui.clearSearch(control);
          if (control.closest(".sidebar-search")) {
            sidebarSearchQuery = "";
            renderNavigation();
          }
        }
        else if (type === "search-size") {
          const detail = control.parentElement.parentElement.nextElementSibling;
          control.parentElement.querySelectorAll("button").forEach((button) => button.classList.toggle("active", button === control));
          detail.dataset.searchSize = control.dataset.size;
          applySearchCatalogProps(detail);
        }
        else if (type === "search-shape") {
          const detail = control.parentElement.parentElement.nextElementSibling;
          control.parentElement.querySelectorAll("button").forEach((button) => {
            const active = button === control;
            button.classList.toggle("active", active);
            button.setAttribute("aria-pressed", String(active));
          });
          detail.dataset.searchShape = control.dataset.shape;
          applySearchCatalogProps(detail);
        }
        else if (type === "text-input-size") {
          const detail = control.parentElement.parentElement.nextElementSibling;
          control.parentElement.querySelectorAll("button").forEach((button) => button.classList.toggle("active", button === control));
          detail.dataset.textInputSize = control.dataset.size;
          applyTextInputCatalogProps(detail);
        }
        else if (type === "text-input-shape") {
          const detail = control.parentElement.parentElement.nextElementSibling;
          control.parentElement.querySelectorAll("button").forEach((button) => {
            const active = button === control;
            button.classList.toggle("active", active);
            button.setAttribute("aria-pressed", String(active));
          });
          detail.dataset.textInputShape = control.dataset.shape;
          applyTextInputCatalogProps(detail);
        }
        else if (type === "number-stepper-size") {
          const detail = control.parentElement.parentElement.nextElementSibling;
          control.parentElement.querySelectorAll("button").forEach((button) => button.classList.toggle("active", button === control));
          detail.dataset.numberStepperSize = control.dataset.size;
          applyNumberStepperCatalogProps(detail);
        }
        else if (type === "number-stepper-shape") {
          const detail = control.parentElement.parentElement.nextElementSibling;
          control.parentElement.querySelectorAll("button").forEach((button) => {
            const active = button === control;
            button.classList.toggle("active", active);
            button.setAttribute("aria-pressed", String(active));
          });
          detail.dataset.numberStepperShape = control.dataset.shape;
          applyNumberStepperCatalogProps(detail);
        }
        else if (type === "chip-size") {
          const detail = control.parentElement.parentElement.nextElementSibling;
          control.parentElement.querySelectorAll("button").forEach((button) => button.classList.toggle("active", button === control));
          ui.setChipPresentation(detail, { size: Number(control.dataset.size) });
        }
        else if (type === "tag-size") {
          const detail = control.parentElement.parentElement.nextElementSibling;
          control.parentElement.querySelectorAll("button").forEach((button) => button.classList.toggle("active", button === control));
          ui.setTagPresentation(detail, { size: Number(control.dataset.size) });
        }
        else if (type === "select-size") {
          const detail = control.parentElement.parentElement.nextElementSibling;
          control.parentElement.querySelectorAll("button").forEach((button) => button.classList.toggle("active", button === control));
          const selectedShape = detail.dataset.selectShape || "default";
          detail.dataset.selectSize = control.dataset.size;
          ui.setSelectPresentation(detail, { size: Number(control.dataset.size), shape: selectedShape });
        }
        else if (type === "select-shape") {
          const detail = control.parentElement.parentElement.nextElementSibling;
          control.parentElement.querySelectorAll("button").forEach((button) => {
            const active = button === control;
            button.classList.toggle("active", active);
            button.setAttribute("aria-pressed", String(active));
          });
          const selectedSize = Number(detail.dataset.selectSize || 40);
          detail.dataset.selectShape = control.dataset.shape;
          ui.setSelectPresentation(detail, { size: selectedSize, shape: control.dataset.shape });
        }
        else if (type === "ui-checkbox-group-item" || type === "ui-checkbox-group-all") ui.toggleCheckboxGroup(control);
        else if (type === "filter-category-parent") ui.toggleFilterCategoryParent(control);
        else if (type === "checkbox") ui.toggleCheckbox(control);
        else if (type === "ui-top-nav-filter") ui.toggleTopNavFilter(control);
        else if (type === "progress") {
          const progress = control.parentElement.querySelector(".progress-track i");
          progress.style.width = `${(parseInt(progress.style.width || "56", 10) + 18) % 101 || 12}%`;
        } else if (type === "dismiss") control.parentElement.style.display = "none";
        else if (type === "pressed") control.classList.toggle("pressed");
        else if (type === "open-button-usage") {
          const modal = document.getElementById("button-usage-modal");
          modal.hidden = false;
          document.body.classList.add("button-usage-open");
          control.setAttribute("data-usage-invoker", "true");
          modal.querySelector(".button-usage-dialog").focus();
        }
        else if (type === "close-button-usage") {
          const modal = document.getElementById("button-usage-modal");
          modal.hidden = true;
          document.body.classList.remove("button-usage-open");
          const invoker = document.querySelector("[data-usage-invoker]");
          if (invoker) { invoker.removeAttribute("data-usage-invoker"); invoker.focus(); }
        }
        else if (type === "open-radius-usage") {
          const modal = document.getElementById("radius-usage-modal");
          modal.hidden = false;
          document.body.classList.add("radius-usage-open");
          control.setAttribute("data-radius-usage-invoker", "true");
          modal.querySelector(".radius-usage-dialog").focus();
        }
        else if (type === "close-radius-usage") {
          const modal = document.getElementById("radius-usage-modal");
          modal.hidden = true;
          document.body.classList.remove("radius-usage-open");
          const invoker = document.querySelector("[data-radius-usage-invoker]");
          if (invoker) { invoker.removeAttribute("data-radius-usage-invoker"); invoker.focus(); }
        }
        else if (type === "open-spacing-usage") {
          const modal = document.getElementById("spacing-usage-modal");
          modal.hidden = false;
          document.body.classList.add("spacing-usage-open");
          control.setAttribute("data-spacing-usage-invoker", "true");
          modal.querySelector(".spacing-usage-dialog").focus();
        }
        else if (type === "close-spacing-usage") {
          const modal = document.getElementById("spacing-usage-modal");
          modal.hidden = true;
          document.body.classList.remove("spacing-usage-open");
          const invoker = document.querySelector("[data-spacing-usage-invoker]");
          if (invoker) { invoker.removeAttribute("data-spacing-usage-invoker"); invoker.focus(); }
        }
        else if (type === "button-size") {
          const detail = control.closest(".button-detail");
          control.parentElement.querySelectorAll("button").forEach((button) => button.classList.toggle("active", button === control));
          detail.dataset.buttonSize = control.dataset.size;
          applyButtonCatalogProps(detail);
        }
        else if (type === "button-shape") {
          const detail = control.closest(".button-detail");
          control.parentElement.querySelectorAll("button").forEach((button) => button.classList.toggle("active", button === control));
          detail.dataset.buttonShape = control.dataset.shape;
          applyButtonCatalogProps(detail);
        }
        else if (type === "ui-sidebar-unpin") ui.unpinSidebarItem(control);
        else if (type === "ui-sidebar-pin") ui.pinSidebarItem(control);
        else if (type === "ui-sidebar-item") ui.selectSidebarItem(control);
        else if (type === "ui-timeline-tone") {
          const switcher = control.closest(".timeline-tone-switch");
          switcher.querySelectorAll("button").forEach((button) => button.setAttribute("aria-pressed", String(button === control)));
          ui.setTimelineTone(control, control.dataset.tone);
        }
        else if (type === "ui-sidebar-more") ui.toggleSidebarMore(control);
        else if (type === "ui-sidebar-more-item") { ui.selectSidebarItem(control); ui.closeSidebarMore(control); }
        else if (type === "ui-sidebar-collapse" || type === "ui-sidebar-brand") ui.toggleSidebar(control);
        else if (type === "ui-sidebar-section") ui.toggleSidebarSection(control);
        else if (type === "button" && control.textContent === "Save") control.textContent = "Saved";
      });
      document.addEventListener("submit", (event) => {
        if (event.target.matches("[data-ui-top-nav-search]")) event.preventDefault();
      });
      document.addEventListener("change", (event) => {
        if (!event.target.matches("[data-demo=ui-upload-input]")) return;
        ui.setUploadFiles(event.target, event.target.files || []);
      });
      document.addEventListener("focusin", (event) => {
        if (event.target.matches("[data-demo=ui-top-nav-search-input]")) ui.setTopNavSearchFocus(event.target, true);
      });
      document.addEventListener("focusout", (event) => {
        if (!event.target.matches("[data-demo=ui-top-nav-search-input]")) return;
        window.requestAnimationFrame(() => {
          if (document.activeElement !== event.target) ui.setTopNavSearchFocus(event.target, false);
        });
      });
      document.addEventListener("pointerdown", (event) => {
        if (event.target.closest("[data-slider-range]")) ui.startSliderRangeDrag(event);
      });
      document.addEventListener("input", (event) => {
        if (event.target.matches("[data-demo=ui-textarea]")) {
          const root = event.target.closest(".ui-textarea");
          const count = root?.querySelector("[data-ui-textarea-count]");
          if (count) count.textContent = `${event.target.value.length}${event.target.maxLength > 0 ? ` / ${event.target.maxLength}` : ""}`;
          return;
        }
        if (event.target.matches("[data-demo=ui-slider-range]")) {
          ui.syncSliderRange(event.target);
          /* The Filter pattern's price pills read off the range; the templates
             call this from their own input handler and this page did not, so the
             numbers moved there and stood still here. */
          ui.syncFilterPrice(event.target.closest("[data-ui-modal], .filter-pattern-detail, .teacher-discovery-filter-pattern") || document);
          return;
        }
        if (event.target.matches("[data-demo=ui-slider]")) {
          ui.syncSliderInput(event.target);
          return;
        }
        if (event.target.matches("[data-demo=ui-top-nav-search-input]")) {
          ui.syncTopNavSearch(event.target);
          return;
        }
        if (event.target.matches(".ui-search input")) {
          ui.syncSearchInput(event.target);
          if (event.target.id === "sidebar-component-search") {
            sidebarSearchQuery = event.target.value;
            renderNavigation();
            return;
          }
          if (event.target.id === "icon-search") {
            iconQuery = event.target.value;
            renderIconGrid();
            return;
          }
          if (event.target.id === "flag-search") {
            flagQuery = event.target.value;
            renderFlagLibrary();
            return;
          }
          return;
        }
        if (event.target.matches("[data-demo=ui-select-search]")) ui.filterSelectOptions(event.target);
      });
      document.addEventListener("pointerover", (event) => {
        const sidebarMore = event.target.closest("[data-ui-sidebar-more]");
        if (sidebarMore && !sidebarMore.contains(event.relatedTarget)) ui.cancelSidebarMoreClose(sidebarMore);
        const item = event.target.closest("[data-demo=ui-rate]");
        if (!item) return;
        const root = item.closest("[data-ui-rate]");
        if (!root || root.dataset.rateDisabled === "true" || item.contains(event.relatedTarget)) return;
        ui.previewRate(item, event);
      });
      document.addEventListener("pointerout", (event) => {
        const sidebarMore = event.target.closest("[data-ui-sidebar-more]");
        if (sidebarMore && !sidebarMore.contains(event.relatedTarget)) ui.scheduleSidebarMoreClose(sidebarMore);
        const item = event.target.closest("[data-demo=ui-rate]");
        if (!item) return;
        const root = item.closest("[data-ui-rate]");
        if (!root || root.dataset.rateDisabled === "true" || root.contains(event.relatedTarget)) return;
        ui.resetRatePreview(item);
      });
      document.addEventListener("keydown", (event) => {
        if (ui.handleDrawerKeydown(event)) return;
        if (event.key === "Escape") {
          const openSelect = event.target.closest(".ui-select") || document.querySelector(".ui-select.is-open");
          if (openSelect && openSelect.classList.contains("is-open")) {
            ui.setSelectOpen(openSelect, false);
            openSelect.querySelector("[data-demo=ui-select-trigger]").focus();
            return;
          }
          const spacingModal = document.getElementById("spacing-usage-modal");
          if (spacingModal && !spacingModal.hidden) {
            spacingModal.hidden = true;
            document.body.classList.remove("spacing-usage-open");
            const spacingInvoker = document.querySelector("[data-spacing-usage-invoker]");
            if (spacingInvoker) { spacingInvoker.removeAttribute("data-spacing-usage-invoker"); spacingInvoker.focus(); }
            return;
          }
          const radiusModal = document.getElementById("radius-usage-modal");
          if (radiusModal && !radiusModal.hidden) {
            radiusModal.hidden = true;
            document.body.classList.remove("radius-usage-open");
            const radiusInvoker = document.querySelector("[data-radius-usage-invoker]");
            if (radiusInvoker) { radiusInvoker.removeAttribute("data-radius-usage-invoker"); radiusInvoker.focus(); }
            return;
          }
          const modal = document.getElementById("button-usage-modal");
          if (modal && !modal.hidden) {
            modal.hidden = true;
            document.body.classList.remove("button-usage-open");
            const invoker = document.querySelector("[data-usage-invoker]");
            if (invoker) { invoker.removeAttribute("data-usage-invoker"); invoker.focus(); }
            return;
          }
        }
        if (ui.handleRateKeydown(event)) return;
        if (ui.handleSelectKeydown(event)) return;
        if (ui.handleModalKeydown(event)) return;
        if (ui.handlePopupKeydown(event)) return;
        if (ui.handlePopconfirmKeydown(event)) return;
        if (ui.handleRadioKeydown(event)) return;
        if (ui.handleSelectionCardKeydown(event)) return;
        if (ui.handleTabsKeydown(event)) return;
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest("[data-component-route]");
        if (!card) return;
        event.preventDefault();
        captureRouteScroll();
        location.hash = card.dataset.componentRoute;
      });
      window.addEventListener("hashchange", () => {
        if (!routeScrollCapturePending) routeScrollPositions.set(route, getCatalogScrollTop());
        routeScrollCapturePending = false;
        route = location.hash.slice(1) || "components";
        render();
        const targetScrollY = routeScrollPositions.get(route) || 0;
        window.requestAnimationFrame(() => {
          window.requestAnimationFrame(() => {
            window.setTimeout(() => {
              setCatalogScrollTop(targetScrollY);
              updateStickyHeading();
            }, 0);
          });
        });
      });
      window.addEventListener("scroll", updateStickyHeading, { passive: true });
      catalogScrollRoot()?.addEventListener("scroll", updateStickyHeading, { passive: true });
      renderNavigation();
      route = location.hash.slice(1) || "components";
      render();
    </script>
  </body>
</html>
