<x-dc>
<!-- @template name="Teacher Search" description="Teacher search results page — filter bar, result count, teacher result rows, pagination." -->
<helmet>
<script src="./ds-base.js"></script>

<link rel="stylesheet" href="./filter-pattern.css">
<link rel="stylesheet" href="./teacher-card-pattern.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;color:var(--ui-color-text);font-family:"Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;font-weight:500}#teacher-filter-modal{position:fixed;inset:0;z-index:var(--ui-layer-overlay,60);min-height:0;display:block;background:transparent;pointer-events:none}#teacher-filter-modal.is-open{pointer-events:auto}#teacher-filter-modal .ui-modal{max-height:calc(100vh - 32px)}body{margin:0;background:var(--ui-color-divider);font-family:"Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:var(--ui-color-link);text-decoration:none}a:hover{color:var(--ui-color-link-hover);text-decoration:underline}/* Duplicates the kit default on purpose. These used to live only here, then
   only in the kit; either way the template depended on the other side being
   in step, and a bundle one version behind left the shell unpositioned.
   Same values as .ui-sidebar / .ui-top-nav, so whichever wins, wins the same.
   The rungs come from the --ui-layer-* scale in tokens.css; the literals are
   only the fallback for a bundle that predates it. */
.ui-sidebar.ui-sidebar{height:100dvh;position:sticky;top:0;z-index:var(--ui-layer-sidebar,41);align-self:flex-start}
.ui-top-nav.ui-top-nav{position:sticky;top:0;z-index:var(--ui-layer-top-nav,40)}
</style>
</helmet>

</div>

<x-import component-from-global-scope="SafeUI.Video" poster="Assets/Images/covers/teacher-intro.jpg" poster-alt="" duration="{{ previewDuration }}" play-label="{{ previewPlayLabel }}" hint-size="100%,180px"></x-import>

<div style="display:grid"><x-import component-from-global-scope="SafeUI.Button" label="{{ previewBookLabel }}" variant="red" size="{{ 40 }}" shape="pill" hint-size="100%,40px"></x-import></div>

</aside>

</div>

<!-- The whole drawer is the Modal component now, with its body composed from
     the kit. Closing is delegated below rather than bound with onClick: the
     kit renders markup, not React nodes, so there is nothing here to bind a

<x-import component-from-global-scope="SafeUI.Modal" id="teacher-filter-modal" title="Filter" size="wide" open="{{ filterOpen }}" trigger="" body="{{ filterBody }}" footer="{{ filterFooter }}" hint-size="920px,780px"></x-import>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  static TEACHERS = {

  static ROSTER = [
    { name: "Lucía Fernández", country: "Spain", flag: "es", pro: true, rating: "4.98", lessons: "2,431 lessons",

      summary: "University lecturer turned full-time tutor. Strong on grammar foundations and exam technique.",
      tags: [["warning", "DELE certificate"], ["success", "Structured lessons"]] },
    { name: "Sofía Herrera", country: "Spain", flag: "es", pro: true, rating: "4.95", lessons: "1,207 lessons",
      speaks: "Spanish", alsoSpeaks: "English C1 · Italian B2", price: "US$18.00", availability: "Available now",
      summary: "Conversation coach for busy professionals. We spend the hour talking; corrections go in the chat.",
      tags: [["success", "Conversation focused"], ["info", "Business Spanish"]] },
    { name: "Diego Morales", country: "Mexico", flag: "mx", pro: false, rating: "4.89", lessons: "3,842 lessons",

      summary: "Great if you have studied before and just need someone patient to talk with. Notes after every lesson.",
      tags: [["success", "Patient"], ["info", "Latin American Spanish"]] },
    { name: "Carmen Ortiz", country: "Spain", flag: "es", pro: true, rating: "5.00", lessons: "612 lessons",

      tags: [["warning", "DELE certificate"], ["success", "Homework included"]] },
    { name: "Andrés Vidal", country: "Argentina", flag: "ar", pro: false, rating: "4.91", lessons: "1,988 lessons",
      speaks: "Spanish", alsoSpeaks: "English C1 · German A2", price: "US$11.00", availability: "Available this week",
      summary: "Conversations with a purpose — films, football, food. I fix grammar quietly as we go.",
      tags: [["success", "Conversation focused"], ["info", "Argentinian Spanish"]] },
    { name: "Elena Ruiz", country: "Spain", flag: "es", pro: true, rating: "4.97", lessons: "2,106 lessons",
      speaks: "Spanish", alsoSpeaks: "English C2 · Catalan native", price: "US$20.00", availability: "Available now",
      summary: "Ten years teaching absolute beginners. We build from sounds to sentences and you speak from lesson one.",
      tags: [["success", "Beginner experienced"], ["success", "Patient"]] },
    { name: "Javier Cano", country: "Colombia", flag: "co", pro: false, rating: "4.86", lessons: "944 lessons",
      speaks: "Spanish", alsoSpeaks: "English B2 · Portuguese B1", price: "US$8.00", availability: "Available tomorrow",
      summary: "Short daily lessons beat one long one. Book a few in a row and you will hear the difference in a month.",
      tags: [["info", "Colombian Spanish"], ["success", "Flexible schedule"]] },
    { name: "Marta Delgado", country: "Spain", flag: "es", pro: true, rating: "4.94", lessons: "1,530 lessons",
      speaks: "Spanish", alsoSpeaks: "English C1", price: "US$16.00", availability: "Available this week",
      summary: "Spanish for work: emails, meetings, calls. Bring a real agenda and we rehearse it together.",
      tags: [["info", "Business Spanish"], ["success", "Structured lessons"]] },
  ];
  static ROW_LABELS = ["00 – 04", "04 – 08", "08 – 12", "12 – 16", "16 – 20", "20 – 24"];
  static DAYS = [
    { id: "mon", label: "Mo", date: "22" }, { id: "tue", label: "Tu", date: "23" },
    { id: "wed", label: "We", date: "24" }, { id: "thu", label: "Th", date: "25" },
    { id: "fri", label: "Fr", date: "26" }, { id: "sat", label: "Sa", date: "27" },
    { id: "sun", label: "Su", date: "28" },
  ];
  // Hours available inside a four-hour band, as shown in the cell tooltip.
  static BAND_HOURS = [1, 1.5, 2, 2.5, 3, 3.5, 4];

  state = {
    ready: !!Component.kit(),
    filterOpen: false,
    preview: "Lucía Fernández",
    previewOffset: 0,
    beginnerMode: false,
  };

  previewRef = React.createRef();

  // The offset is a live measurement, so it is written to the node rather than
  // rendered as a style hole (holes cannot paint until the logic class lands).
  componentDidUpdate() {
    const el = this.previewRef.current;
    if (el) el.style.marginTop = this.state.previewOffset + "px";
  }

  componentDidMount() {
    // Hover-to-preview is template behaviour and must not wait on either kit build.
    this.onOver = (e) => {
      const card = e.target.closest?.("article[data-teacher]");
      if (!card) return;
      const name = card.dataset.teacher;
      if (!name || name === this.state.preview) return;
      /* The panel tracks the hovered card, but only as far as the list goes:
         top-aligning with one of the last cards would hang the panel below the
         list, so the offset is capped at the point where the panel's bottom sits
         flush with the last card's bottom. Near the end of the list the panel
         therefore bottom-aligns instead of top-aligns. */
      const list = card.parentElement;
      let offset = 0;
      if (list) {
        const wanted = card.getBoundingClientRect().top - list.getBoundingClientRect().top;
        const panel = this.previewRef.current;
        const room = list.offsetHeight - (panel ? panel.offsetHeight : 0);
        offset = Math.max(0, Math.round(Math.min(wanted, room)));
      }
      this.setState({ preview: name, previewOffset: offset });
    };
    document.addEventListener("mouseover", this.onOver, true);

    /* Registered before the ready check, not after. `ready` starts true whenever
       the bundle is already cached, and the early return below then skipped
       this — so the filter button worked on a cold load and was silently dead
       on a warm one. Listening does not depend on the kit being there. */
    /* TopNav renders as a static HTML string, so its filter button carries no
       React handler — delegate instead and open the filter drawer from here. */
    this.onNavClick = (e) => {
      if (e.target.closest && e.target.closest(".ui-top-nav-search__filter")) {
        e.preventDefault();
        this.setState((s) => ({ filterOpen: !s.filterOpen }));
        return;
      }
      /* The drawer's own dismissals. They used to be onClick bindings on
         hand-written markup; the markup is the component's now, so the state
         has to be reached the same way the open does. */
      const inDrawer = e.target.closest && e.target.closest("#teacher-filter-modal");
      if (inDrawer && e.target.closest('.ui-modal__mask, .ui-modal__close, [data-demo="filter-apply"]')) {
        this.setState({ filterOpen: false });
      }
    };
    document.addEventListener("click", this.onNavClick, true);

    const loaded = () => Component.kit();
    const start = () => {};
    if (this.state.ready) { start(); return; }
    // ds-base.js loads the kit asynchronously; re-render once it is available.
    this.timer = setInterval(() => {
      if (!loaded()) return;
      clearInterval(this.timer);
      start();
      this.setState({ ready: true });
    }, 50);
  }

  componentWillUnmount() {
    clearInterval(this.timer);
    document.removeEventListener("mouseover", this.onOver, true);
    document.removeEventListener("click", this.onNavClick, true);
  }

  // The row shape the results list binds. Both render paths read it from here:
  // renderVals() and reactVals() each used to build their own view of the
  // roster, and only one of them was ever kept in step.
  rosterRows() {
    const C = this.constructor;
    return C.ROSTER.map((t, i) => ({
      ...t,
      label: "Result " + String(i + 1).padStart(2, "0"),
      avatarLabel: t.name + ", " + t.country,
      photo: (C.TEACHERS[t.name] || {}).photo || "",
      role: t.pro ? "Professional Teacher" : "Community Tutor",
      roleIcon: "../../Assets/Icons/certified-solid-" + (t.pro ? "red" : "teal") + ".svg",
      tags: t.tags.map(([tone, label]) => ({ tone, label })),
    }));
  }

  /* The kit is reachable under two names and they are the same object:
     window.ITalkiUI is the vanilla runtime, and the React bundle re-exports it
     as window.ItalkiUI.raw. Reading only the first made the shell depend on
     which one the host happened to install — when it was missing the sidebar
     rendered empty, or fell through to a second, half-maintained code path. */
  static kit() { return window.ITalkiUI || (window.ItalkiUI || {}).raw || null; }

  /* If neither name shows up, say so instead of rendering an empty rail. */
  static warnMissingKit() {
    if (document.getElementById("ds-kit-missing")) return;
    const el = document.createElement("div");
    el.id = "ds-kit-missing";
    el.textContent = "Design-system bundle not loaded: neither window.ITalkiUI nor window.ItalkiUI.raw is available.";
    el.style.cssText = "position:fixed;z-index:9999;top:0;left:0;right:0;padding:8px 12px;background:var(--ui-color-error);color:var(--ui-color-on-primary);font:12px/1.5 system-ui";
    document.body.appendChild(el);
  }

  previewVals() {
    const C = this.constructor;
    const name = this.state.preview;
    const t = C.TEACHERS[name] || C.TEACHERS["Lucía Fernández"];
    return {
      previewRef: this.previewRef,
      previewName: name,
      previewInitials: t.initials,
      previewPhoto: t.photo,
      previewTone: "ui-avatar--tone-" + t.tone,
      previewPrice: t.price,
      previewDuration: t.duration,
      previewDates: C.DAYS,
      previewRows: C.availabilityFor(name),
    };
  }

  // Six four-hour bands × seven days, as in the Calendar catalog card. Derived from the
  // teacher's name so each roster entry has a stable, distinct week.
  static availabilityFor(name) {
    const C = this;
    let seed = 0;
    for (let i = 0; i < name.length; i++) seed = (seed * 31 + name.charCodeAt(i)) % 100003;
    const rand = (n) => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed % n; };
    return C.ROW_LABELS.map((label, i) => ({
      id: "band-" + i,
      label,
      slots: C.DAYS.map(() => {
        // Daytime bands are likelier to be open than the small hours.
        const open = rand(10) < (i === 0 || i === 5 ? 3 : 7);
        return open
          ? { state: "available", hours: C.BAND_HOURS[rand(C.BAND_HOURS.length)] }
          : { state: "unavailable" };
      }),
    }));
  }

  /* No dispatcher here. The kit's behaviours are wired once in ds-safe.js —
     one table, shared by both templates. Two of them binding the same hooks
     means every click is handled twice, and a toggle handled twice is a toggle
     that never moves. */
  /* The filter drawer, composed from the kit rather than copied out of it.

     This used to be twenty-nine kilobytes of markup on one line — the rendered
     output of the Catalog's Filter pattern, pasted in. It looked identical and
     tracked nothing: fifty-eight chips, eight selection cards, seven checkboxes,
     a slider and a tab set, all frozen at the shape those components had on the
     day it was copied. Change Chip and the Catalog's card follows; this did not,
     and nothing would have said so.

     It is the same composition the Catalog performs, calling the same
     renderers. Icons stay page-relative "Assets/…" paths — ds-safe rewrites
     them for this folder's depth. */
  filterBody(UI) {
    const chip = (label, selected = false) => UI.chip({ label, size: 32, selected, demo: "ds-chip" });
    const field = (caption, content) =>
      `<div class="filter-pattern__cluster"><p class="filter-pattern__caption">${caption}</p><div class="filter-pattern__chip-row">${content}</div></div>`;
    const iconButton = (label) => UI.button({ variant: "text", size: 32, shape: "pill", leadingIcon: "Assets/Icons/search.svg", iconOnly: true, ariaLabel: label });
    const timeOption = (label, icon, selected = false) =>
      `<div>${UI.selection({ label, value: label, selected, contentType: "icon-simple", selectionMode: "checkbox", leading: `<img src="${icon}" alt="" />`, demo: "ui-selection-card" })}</div>`;
    const teacherOption = (label, description, icon) =>
      `<div class="filter-pattern__teacher-option">${UI.selection({ label, value: label, description, selected: true, selectedMarker: true, contentType: "icon-simple", selectionMode: "checkbox", leading: `<img src="${icon}" alt="" />`, demo: "ui-selection-card" })}</div>`;
    /* A category chip carries the group it belongs to, so the disclosure can
       find its children. The Catalog rewrites the demo hook the same way. */
    const categoryChip = (categoryId, label, selected = false) =>
      chip(label, selected).replace('data-demo="ds-chip"', `data-demo="filter-category-child" data-filter-category-child data-filter-category-id="${categoryId}"${label === "All" ? " data-filter-category-all" : ""}`);
    const categoryGroup = (id, label, children, checked = false) =>
      `<div class="filter-pattern__category" data-filter-category data-expanded="${checked}">${UI.checkbox({ id: `filter-category-${id}`, label, checked: checked ? "on" : "off", demo: "filter-category-parent" })}<div class="filter-pattern__category-children" data-filter-category-children${checked ? "" : " hidden"}><div class="filter-pattern__chip-row">${children.map((child) => categoryChip(id, child, checked && child === "All")).join("")}</div></div></div>`;

    const histogram = [26, 44, 72, 60, 36, 28, 48, 32, 20, 36, 52, 42, 26, 20, 16, 12, 8, 6]
      .map((height, index) => `<i class="${index > 1 && index < 5 ? "is-selected" : ""}" style="--filter-bar-height:${height}px"></i>`).join("");

    const availability = UI.tabs({
      id: "filter-availability-tabs",
      activeId: "general",
      ariaLabel: "Availability preference",
      items: [
        { id: "general", label: "General", panel:
          `<div class="filter-pattern__cluster"><div class="filter-pattern__chip-row">${chip("Instant lesson")}${chip("Within 72 hours")}</div></div>`
          + `<div class="filter-pattern__cluster"><p class="filter-pattern__caption">Days of the week</p><div class="filter-pattern__day-row">${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((day) => chip(day, day === "Mon")).join("")}</div></div>`
          + `<div class="filter-pattern__cluster"><p class="filter-pattern__caption">Time range</p><div class="filter-pattern__time-grid">${timeOption("00:00 - 04:00", "Assets/Icons/morning.svg")}${timeOption("04:00 - 08:00", "Assets/Icons/morning.svg")}${timeOption("08:00 - 12:00", "Assets/Icons/afternoon.svg")}${timeOption("12:00 - 16:00", "Assets/Icons/afternoon.svg", true)}${timeOption("16:00 - 20:00", "Assets/Icons/evening.svg", true)}${timeOption("20:00 - 24:00", "Assets/Icons/night.svg")}</div></div>` },
        { id: "specific", label: "Specific time", panel: `<p class="filter-pattern__caption">Choose an exact date and time with the documented Date picker and Time slot components.</p>` },
      ],
    });

    const lessonCategory = `<section class="filter-pattern__card"><header class="filter-pattern__card-head"><h3>Lesson category</h3></header><div class="filter-pattern__check-list">`
      + categoryGroup("language-essentials", "Language Essentials", ["All", "Pronunciation", "Grammar", "Spelling", "Reading", "Listening", "Writing", "Speaking"], true)
      + categoryGroup("conversation", "Conversation", ["All", "Everyday conversation", "Speaking confidence", "Small talk"])
      + categoryGroup("business", "Business", ["All", "Meetings", "Presentations", "Interviews"])
      + categoryGroup("test-preparation", "Test Preparation", ["All", "IELTS", "TOEFL", "TOEIC"])
      + categoryGroup("medical", "Medical", ["All", "Healthcare", "Nursing", "Medical interviews"])
      + categoryGroup("technology", "Technology", ["All", "Software engineering", "Product", "Data science"])
      + `</div></section>`;

    /* The Plus row needs its badge inside the checkbox label, which the
       component does not model. Rewriting its own output is how the Catalog
       does it too — the alternative is hand-rolling the checkbox. */
    const plusCheckbox = UI.checkbox({ id: "filter-plus", label: "Plus features available", checked: "on", demo: "checkbox" })
      .replace("<span>Plus features available</span>", '<span><img src="Assets/Icons/Plustag.svg" alt="" /><span>Plus features available</span></span>');
    const teacherType = `<section class="filter-pattern__card"><header class="filter-pattern__card-head"><h3>Teacher type</h3></header><div class="filter-pattern__teacher-type">`
      + plusCheckbox
      + teacherOption("Professional teacher", "Certified teachers with a wealth of experience", "Assets/Icons/teacher-professional.svg")
      + teacherOption("Community tutor", "Guide language learners with real-world practice", "Assets/Icons/teacher-community.svg")
      + `</div></section>`;

    return `<div class="filter-pattern__body">`
      + `<section class="filter-pattern__card"><header class="filter-pattern__card-head"><h3>Teacher from</h3>${iconButton("Search teacher origin")}</header><div class="filter-pattern__chip-row">${chip("Native speaker")}</div>`
      + field("Popular countries/regions", ["United States", "United Kingdom", "Canada", "Australia", "South Africa", "Ireland"].map((label) => chip(label)).join(""))
      + field("Other countries/regions", ["Hong Kong", "United Arab Emirates", "Portugal", "Russia"].map((label) => chip(label)).join(""))
      + `</section>`
      + `<section class="filter-pattern__card"><header class="filter-pattern__card-head"><h3>Also speak</h3>${iconButton("Search additional language")}</header>`
      + field("My speaking language", ["Chinese (Mandarin)", "Japanese"].map((label) => chip(label)).join(""))
      + field("Popular languages", ["English", "Spanish", "French", "Korean", "German", "Italian", "Portuguese", "Russian"].map((label) => chip(label)).join(""))
      + `</section>`
      + `<section class="filter-pattern__card"><header class="filter-pattern__card-head"><h3>Price range</h3></header><div class="filter-pattern__price-chart" aria-hidden="true">${histogram}</div><div class="filter-pattern__price-range">${UI.sliderRange({ lower: 20, upper: 70, label: "Lesson price" })}<div class="filter-pattern__range-values"><span>Minimum<output>$12</output></span><span>Maximum<output>$227</output></span></div></div></section>`
      + `<section class="filter-pattern__card filter-pattern__availability"><header class="filter-pattern__card-head"><h3>Availability</h3></header>${availability}</section>`
      + lessonCategory + teacherType + `</div>`;
  }

  renderVals() {
    // One render path. There used to be a second — reactVals — that ran only
    // when the vanilla namespace was missing, and it had never been kept in
    // step: its icons were bare names the asset contract rejects. A path that
    // runs only when something else has already gone wrong is a path nobody
    // tests.
    const UI = Component.kit();
    if (!UI) return {};

    /* italki's shell roster comes from the kit, not from here. Three pages
       used to write it out by hand and the three had drifted apart: this one
       carried a Practice and a Vocabulary that were never in the spec, and the
       profile page's More menu held two entries where this one held five. Same
       component throughout — the list was just data nobody was keeping in step.
       Bare icon names on purpose: the renderer resolves them, which is what
       makes one list correct here and two folders down. */
    const { items: navItems, moreItems } =
      UI.appShellNav?.({ active: "search-teachers" }) ?? { items: [], moreItems: [] };

    // Row shapes mirror the Catalog's #sidebar: chat rows lead with a 24px
    // avatar; lesson rows carry a count prefix, divider and secondary line.
    // A sidebar row's leading slot takes rendered markup, not a URL: the item
    // has no `avatar` key, so passing the photo directly dropped it silently.
    const portrait = (n) => UI.avatar({
      image: (this.constructor.TEACHERS[n] || {}).photo || "",
      size: 24,
      ariaLabel: n,
    });
    const navSections = [
      { id: "chats", label: "Chats", open: true, items: [
        { id: "chat-lucia", label: "Lucía Fernández", secondary: "2m", leading: portrait("Lucía Fernández") },
        { id: "chat-mateo", label: "Mateo Rojas", secondary: "1h", leading: portrait("Mateo Rojas") },
        { id: "chat-valentina", label: "Valentina Cruz", secondary: "Yesterday", leading: portrait("Valentina Cruz") },
      ] },
      { id: "lessons", label: "Lessons", items: [
        { id: "lesson-today", prefix: "12", divider: true, label: "Spanish B1", secondary: "Today 18:00" },
        { id: "lesson-thu", prefix: "13", divider: true, label: "Spanish B1", secondary: "Thu 18:00" },
      ] },
    ];


    const sidebarFooter =
      '<button class="ui-sidebar__item" type="button" style="width:auto">' +
      '<img class="ui-sidebar__item-icon" src="../../Assets/Icons/wallet.svg" alt="" />' +
      "<span>$293.45 USD</span></button>" +
      UI.avatar({ initials: "NI", size: 32, tone: "primary", interactive: true, ariaLabel: "Your profile" });

    /* The bar is a named variant now, so the template supplies the data and
       the component composes the context picker, the search field and the
       action. It used to build all three by hand and pass them in as markup. */
    const languageOptions = [
      { id: "spanish", label: "Spanish teachers", flag: "Assets/Flags/es.svg" },
      { id: "english", label: "English teachers", flag: "Assets/Flags/gb.svg" },
      { id: "japanese", label: "Japanese teachers", flag: "Assets/Flags/jp.svg" },
      { id: "french", label: "French teachers", flag: "Assets/Flags/fr.svg" },
    ];

    return {
      navItems,
      navSections,
      moreItems,
      sidebarFooter,
      // The markup binds twenty-one names; this path returned six. The results
      // list, the preview card, its calendar and the filter drawer all read
      // from the missing fifteen, so they resolved to undefined and rendered
      // as nothing — the calendar loudly, the rest silently.
      ...this.previewVals(),
      teachers: this.rosterRows(),
      beginnerMode: this.state.beginnerMode,
      beginnerClass: this.state.beginnerMode ? "is-checked" : "",
      toggleBeginner: () => this.setState((s) => ({ beginnerMode: !s.beginnerMode })),
      resultPages: [1, 2, 3, "ellipsis", 64],
      previewPlayLabel: `Play ${this.state.preview}'s introduction video`,
      previewBookLabel: `Book trial · ${this.previewVals().previewPrice}`,
      filterOpen: this.state.filterOpen,
      filterBody: this.filterBody(UI),
      /* Two buttons the kit renders. Neither can carry an onClick — this is a
         markup string — so the drawer closes through the delegated handler.
         The treatment follows the Filter pattern's own footer: secondary and
         red at 40, default shape. It had drifted to text/32/pill here, which
         is the same failure as every other copied choice — the component was
         right and the props were a private opinion. */
      filterFooter:
        UI.button({ label: "Reset", variant: "secondary", size: 40, shape: "default" })
        + UI.button({ label: "Show 1,284 teachers", variant: "red", size: 40, shape: "default", demo: "filter-apply" }),
      languageOptions,
    };
  }
}
</script>
</body>
</html>
